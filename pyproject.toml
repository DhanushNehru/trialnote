[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trailnote"
version = "0.1.0"
description = "An offline-first CLI tool for plant and bird identification"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "transformers",
    "Pillow",
    "torch",
    "torchvision",
    "gradio"
]

[project.scripts]
trailnote = "trailnote.cli:main"
trailnote-web = "trailnote.web:launch_web"
